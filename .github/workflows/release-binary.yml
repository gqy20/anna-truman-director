# Build platform-specific PyInstaller binaries for the truman-director Executa
# and attach them to a GitHub Release. Anna Agent downloads the one matching
# the user's OS/arch and spawns it as a stdio JSON-RPC child (forum topic 140).
#
# Trigger: push a tag `truman-director-v<version>` (version = executa.json#version),
# or run manually from the Actions tab. The release job refuses to publish an
# incomplete matrix: all four archives must exist and contain the platform's
# expected bin/<tool_id>[.exe] plus manifest.json. Keep the deterministic
# Release URLs in executa.json BEFORE `anna-app executa publish`; that command
# freezes the platform map into an immutable ExecutaVersion.
#
# Marketplace screenshots may be uploaded to this same version Release only
# AFTER this workflow finishes (`gh release upload <tag> ...`). They are listing
# assets, not Executa payloads, and must never replace the four binary archives.
#
# darwin-x86_64 is built on the native macos-15-intel runner (forum topic 140):
# cross-building x64 on an Apple Silicon runner (macos-15 + python_arch:x64)
# produced an arm64 binary in practice. windows-x86_64 is kept beyond the
# topic-140 three-platform set because the author's Agent runs on Windows.

name: release-binary

on:
  push:
    tags: ["truman-director-v*"]
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release creates/edits the Release

jobs:
  build:
    name: build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-14,        name: darwin-arm64 }
          - { os: macos-15-intel,  name: darwin-x86_64 }
          - { os: ubuntu-latest,   name: linux-x86_64 }
          - { os: windows-latest,  name: windows-x86_64 }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v7
        with:
          path: anna-truman-director

      # executa-sdk is a local path dep (pyproject [tool.uv.sources]:
      # ../anna-executa-examples/sdk/python). Check it out beside the app.
      - name: Checkout executa-sdk (local path dep)
        uses: actions/checkout@v7
        with:
          repository: whtcjdtc2007/anna-executa-examples
          path: anna-executa-examples

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyinstaller + SDK + pyyaml
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller pyyaml
          python -m pip install ./anna-executa-examples/sdk/python

      # PLATFORM env pins the Anna platform key — package_binary.sh uses it
      # instead of `uname -m`. shell: bash so the same script runs on Windows
      # (git-bash) as on mac/linux.
      - name: Pack binary
        working-directory: anna-truman-director
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.name }}
        run: bash scripts/package_binary.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform.name }}
          path: anna-truman-director/dist-anna/*.tar.gz

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Gather all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-anna
          merge-multiple: true

      - name: Verify complete four-platform payload
        shell: bash
        run: |
          set -euo pipefail
          platforms=(darwin-arm64 darwin-x86_64 linux-x86_64 windows-x86_64)
          for platform in "${platforms[@]}"; do
            shopt -s nullglob
            matches=(dist-anna/*-"$platform".tar.gz)
            shopt -u nullglob
            [[ ${#matches[@]} -eq 1 ]] || {
              echo "ERROR: expected exactly one archive for $platform, found ${#matches[@]}" >&2
              exit 1
            }
            archive="${matches[0]}"
            [[ -s "$archive" ]] || { echo "ERROR: empty archive: $archive" >&2; exit 1; }
            base="$(basename "$archive")"
            tool_id="${base%-$platform.tar.gz}"
            ext=""
            [[ "$platform" == windows-* ]] && ext=".exe"
            tar tzf "$archive" | grep -Fx "manifest.json" >/dev/null
            tar tzf "$archive" | grep -Fx "bin/$tool_id$ext" >/dev/null
            echo "✓ $platform: $archive"
          done

      - name: sha256 sidecars
        run: |
          set -euo pipefail
          cd dist-anna
          for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          [[ $(find . -maxdepth 1 -name '*.tar.gz' | wc -l) -eq 4 ]]
          [[ $(find . -maxdepth 1 -name '*.sha256' | wc -l) -eq 4 ]]

      - name: Attach to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-anna/*.tar.gz
            dist-anna/*.sha256
          generate_release_notes: true
