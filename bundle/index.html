<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>楚门镇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">楚门镇</div>
    <div class="timecode" id="timecode">--:--<span class="tc-caret"></span></div>
    <button id="btn-tick" class="ghost icon" disabled title="推进 1 tick">▶</button>
    <button id="btn-tick5" class="ghost icon" disabled title="推进 5 ticks">⏩</button>
  </header>

  <main class="stage-wrap">
    <section class="stage" id="map" aria-label="小镇舞台"></section>

    <aside class="panel">
      <div class="panel-h story-h">今日故事</div>
      <div class="stories" id="stories"></div>
      <div class="panel-h">字幕</div>
      <ol class="subtitles" id="timeline"></ol>
    </aside>
  </main>

  <footer class="director-bar">
    <input id="inject-input" type="text" placeholder="下一场戏,由你说了算——比如:暴雨将至" aria-label="导演注入" />
    <button id="btn-inject" class="primary" disabled>🎬 注入</button>
  </footer>

  <p class="toast" id="status"></p>

  <!-- 第一幕:戏剧开场(章节卡) -->
  <div class="openings" id="openings" hidden>
    <div class="chapters">
      <h3 class="chapters-title">第一幕</h3>
      <div class="chapters-list" id="openings-list"></div>
      <button class="chapters-skip" id="openings-skip">静场开场</button>
    </div>
  </div>

  <!-- 居民档案 -->
  <div class="modal-backdrop" id="agent-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="agent-name">
      <button class="modal-close" id="agent-close" aria-label="关闭">×</button>
      <h3 id="agent-name">—</h3>
      <p class="agent-meta" id="agent-meta"></p>
      <p class="agent-goal" id="agent-goal"></p>
      <h4>关系</h4>
      <ul class="agent-rels" id="agent-rels"></ul>
      <h4>近事</h4>
      <ol class="agent-events" id="agent-events"></ol>
    </div>
  </div>

  <!-- tool_id mapping (handle → minted id) must load BEFORE app.js reads it -->
  <script src="anna-tool-ids.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
